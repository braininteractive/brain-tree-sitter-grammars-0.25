[package]
name = "tree-sitter-ninja"
description = "ninja grammar for the tree-sitter parsing library"
version = "0.25.0"
keywords = ["incremental", "parsing", "ninja"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/alemuller/tree-sitter-ninja"
edition = "2021"
license = "MIT"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tree-sitter = "0.25"
