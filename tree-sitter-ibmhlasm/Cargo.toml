[package]
name = "tree-sitter-ibmhlasm"
description = "ibmhlasm grammar for the tree-sitter parsing library"
version = "0.25.0"
keywords = ["incremental", "parsing", "ibmhlasm"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/janus-llm/tree-sitter-ibmhlasm"
edition = "2021"
license = "Apache-2.0"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "src/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tree-sitter = "0.25"
