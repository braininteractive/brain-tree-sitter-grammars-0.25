[package]
name = "tree-sitter-freemarker"
description = "FreeMarker template grammar for tree-sitter"
version = "0.25.0"
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "freemarker", "ftl"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/debba/tree-sitter-freemarker"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tree-sitter = "0.25"
