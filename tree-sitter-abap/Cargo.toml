[package]
name = "tree-sitter-abap"
description = "Abap grammar for tree-sitter"
version = "0.25.0"
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "abap"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/mkoval1/tree-sitter-abap"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0.87"

[dev-dependencies]
tree-sitter = "0.25"
